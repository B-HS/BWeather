name: Deploy to Server

on:
    push:
        branches:
            - deploy

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Create .env file
              run: echo "${{ secrets.ENV_FILE }}" > .env

            - name: Build Docker image
              run: docker build -t bweather:latest .

            - name: Save Docker image
              run: docker save bweather:latest -o bweather.tar

            - name: Copy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USERNAME }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_PORT }}
                  source: 'bweather.tar,compose.yml'
                  target: ${{ secrets.DEPLOY_PATH }}

            - name: Deploy with Docker Compose
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USERNAME }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_PORT }}
                  script: |
                      cd ${{ secrets.DEPLOY_PATH }}
                      docker load -i bweather.tar
                      docker compose down
                      docker compose up -d
                      rm bweather.tar

# Required Secrets:
# - ENV_FILE: .env 파일 내용 전체
# - SERVER_HOST: 서버 IP 또는 도메인
# - SERVER_USERNAME: SSH 접속 사용자명
# - SERVER_SSH_KEY: SSH 개인키 (-----BEGIN OPENSSH PRIVATE KEY----- 포함)
# - SERVER_PORT: SSH 포트 (기본값 22)
# - DEPLOY_PATH: 서버 배포 경로 (예: /home/user/bweather)
